name: PR check

# main 宛ての PR で、マージ前に機械的に検査できるものを検査する。
# M4 の演習で「CI が赤くなる → ログを読む → 直す」を体験するための CI。
#
# 方針（本番の開発リポジトリと同じ考え方）:
#   - secrets を一切使わない（PR の作成者が workflow を書き換えても、読み出せる秘密が無い）
#   - pull_request を使い、pull_request_target は使わない
#   - 権限は contents: read のみ
#
# 構成: 各モジュールの題材は modules/<名前>/ の中に独立して置く。
# 現在の対象は M4 の app/ だけ。モジュールを足すときは、同じ形のジョブを足す。

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/m4-pr-and-ci/app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: modules/m4-pr-and-ci/app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 公式の gitleaks/gitleaks-action は、組織アカウントのリポジトリでライセンスキーが
      # 必要なため使わない。バージョン固定＋SHA256 検証付きでバイナリを取得して実行する。
      # 更新するときは https://github.com/gitleaks/gitleaks/releases の checksums.txt
      # （linux_x64）から GITLEAKS_SHA256 を取り直すこと。
      # TODO(草案): このハッシュは本番の開発リポジトリの設定を流用した。初回の実行で検証すること。
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      # PR のコミット範囲（base..head）を検査するため、履歴を全取得する。
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan commits in this PR
        run: |
          gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
